<!doctype html>
<!-- The 1280x640 link preview (og:image and the GitHub social preview).
     Render it with: node shoot-social.mjs  (writes ../public/social-preview.png) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../src/styles/fonts.css">
<style>
  :root {
    --paper: #FBFBF5; --ink: #001129; --ink-2: #3B4759; --ink-3: #5F6B7A;
    --frame: #0A2C49; --hair: rgba(10, 44, 73, 0.2); --land: #F3ECD6; --shoal: #E7EFEE;
    --track: rgba(25, 24, 25, 0.42); --course: #191819; --heed: #9A1659;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; background: var(--paper); overflow: hidden; }
  body { font: 400 17px/1.5 "Inter", sans-serif; color: var(--ink); }

  /* The chart sheet: outer line, graduated border, inner neatline, as on the homepage */
  .sheet { position: absolute; inset: 14px; border: 1.5px solid var(--frame); padding: 7px; }
  .sheet::before, .sheet::after {
    content: ""; position: absolute; top: 7px; bottom: 7px; width: 7px;
    background: repeating-linear-gradient(to bottom, var(--frame) 0 48px, transparent 48px 96px);
  }
  .sheet::before { left: 0; } .sheet::after { right: 0; }
  .neat { position: relative; height: 100%; border: 1px solid var(--frame); }
  .water { position: absolute; inset: 0; overflow: hidden; }
  .neat::before, .neat::after {
    content: ""; position: absolute; left: -1px; right: -1px; height: 7px; z-index: 3;
    background: repeating-linear-gradient(to right, var(--frame) 0 48px, transparent 48px 96px);
  }
  .neat::before { top: -8px; } .neat::after { bottom: -8px; }

  /* Faint coastline and soundings behind the console */
  .chart { position: absolute; right: 0; top: 0; width: 62%; height: 100%; z-index: 0; }
  .chart .land { fill: var(--land); }
  .chart .shoal { fill: var(--shoal); }
  .chart .coast { fill: none; stroke: var(--frame); stroke-width: 1.1; opacity: 0.8; }
  .chart .c5 { fill: none; stroke: var(--frame); stroke-width: 0.9; stroke-dasharray: 1 4; stroke-linecap: round; opacity: 0.7; }
  .chart text { font: 400 12px "Space Grotesk", sans-serif; fill: rgba(10, 44, 73, 0.55); }

  .copy { position: absolute; left: 52px; top: 44px; width: 560px; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 12px; font: 600 26px/1 "Space Grotesk", sans-serif; letter-spacing: -0.01em; }
  .brand img { height: 32px; width: auto; }
  h1 { font: 500 52px/1.04 "Space Grotesk", sans-serif; letter-spacing: -0.03em; margin: 44px 0 22px; }
  .lede { font-size: 21px; line-height: 1.45; color: var(--ink-2); margin: 0; max-width: 30em; }

  .cmd { position: absolute; left: 52px; bottom: 48px; z-index: 2; display: flex; border: 1px solid var(--frame); background: var(--paper);
         font: 400 17px/1 "Space Mono", monospace; }
  .cmd code { padding: 14px 18px; }
  .cmd code::before { content: "$ "; color: var(--ink-3); }
  .fine { position: absolute; left: 52px; bottom: 20px; z-index: 2; font-size: 14px; color: var(--ink-3); }

  /* The console, as an inset that runs off the sheet's edge */
  .inset { position: absolute; left: 666px; top: 128px; width: 760px; z-index: 1; border: 1px solid var(--frame); background: var(--paper);
           box-shadow: 0 1px 0 var(--frame); }
  .inset-t { display: inline-block; font: 500 14px/1.3 "Space Grotesk", sans-serif; padding: 7px 12px;
             border-right: 1px solid var(--frame); border-bottom: 1px solid var(--frame); }
  .inset .clip { height: 366px; overflow: hidden; border-top: 1px solid var(--hair); margin-top: -1px; }
  .inset img { display: block; width: 1000px; margin: -10px 0 0 -6px; }
</style>
</head>
<body>
<div class="sheet"><div class="neat"><div class="water">
  <svg class="chart" viewBox="0 0 760 600" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
    <path class="land" d="M760 0 L520 0 C540 40 600 60 610 110 C620 160 680 170 700 220 C716 262 740 270 760 300 Z"/>
    <path class="coast" d="M520 0 C540 40 600 60 610 110 C620 160 680 170 700 220 C716 262 740 270 760 300"/>
    <path class="shoal" d="M760 330 C720 320 690 300 650 296 C600 290 560 250 520 240 C470 228 430 180 420 120 C412 70 380 30 360 0 L520 0 C540 40 600 60 610 110 C620 160 680 170 700 220 C716 262 740 270 760 300 Z"/>
    <path class="c5" d="M760 360 C700 350 660 330 620 326 C560 320 520 280 470 268 C410 252 380 200 370 130 C364 80 340 30 320 0"/>
    <path class="c5" d="M760 420 C690 410 640 392 590 386 C520 378 470 340 420 320 C350 292 320 220 312 150 C306 90 290 40 270 0"/>
    <text x="236" y="40">12</text><text x="330" y="90">9</text><text x="440" y="60">7</text>
    <text x="300" y="560">14</text><text x="470" y="540">11</text><text x="640" y="566">8</text>
  </svg>

  <div class="copy">
    <div class="brand"><img src="../../tiller-logo.svg" alt="">tiller</div>
    <h1>Your team and your agents, shipping software you'd put your name on.</h1>
    <p class="lede">Tiller helps a team of people and coding agents deliver high-quality software fast, with the confidence to ship it.</p>
  </div>

  <figure class="inset" style="margin:0">
    <span class="inset-t">The console</span>
    <div class="clip"><img src="../public/console-home-light.webp" alt=""></div>
  </figure>

  <div class="cmd"><code>brew install --cask madeintandem/tap/tiller</code></div>
  <div class="fine">Open source, Apache 2.0 · madeintandem.github.io/tiller</div>
</div></div></div>
</body>
</html>
