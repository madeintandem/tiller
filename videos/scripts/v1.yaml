id: v1
title: Set Tiller up on a repo you already have
description: >-
  Install Tiller, add it to an existing codebase, and have your agent write down
  what the code does today. You read those docs and confirm them, and that
  confirmed baseline is what every later change gets measured against. First of
  three videos that take one small feature from an empty plan to merged.
tags: [tiller, ai coding agents, claude code, brownfield, spec-driven development]
intro:
  # DRAFT for JC to say on camera in his own words. After filming, replace this
  # with what he actually said; it is aligned to the clip for the captions.
  transcript: >-
    Hi, I'm JC from Made In Tandem. In this video I'm going to show you how to
    set Tiller up on a codebase you already have. One thing before we start:
    from here on it's my words, in my voice, performed by AI.
captures:
  - id: doc-review
    mark: s1-readout
    path: /file/.tiller/design/as-is/orders-api.md#L1
    seconds: 26
    actions:
      # The behavior to preserve (with the 405 detail) is below the fold; bring it up as it is narrated.
      - waitFor: "text=Behavior to preserve"
      - wait: 8
      - scrollTo: "text=Behavior to preserve"
  - id: home
    mark: s1-end
    path: /
    seconds: 22
  - id: doc-confirmed
    mark: s1-end
    path: /file/.tiller/design/as-is/orders-api.md#L1
    seconds: 12
beats:
  - id: install
    chapter: Install
    say: >-
      On a Mac, Tiller comes from Homebrew; it's the one line on the screen.
      Linux gets a short install script, linked from the README. Either way
      you get a single binary. No account, no hosted service, no settings
      file hiding in your home directory.
    show:
      kind: card
      kicker: Install
      heading: Get Tiller on your machine
      body: brew install --cask madeintandem/tap/tiller
  - id: version
    say: >-
      Ask for its version to make sure it's on your path. This series was
      recorded on version 0.22, so if yours is newer, some wording may differ.
    show:
      kind: term
      stage: s1
      from: s1-version
      to: s1-version
  - id: repo-card
    chapter: Join your repo
    say: >-
      Here's the repo for the whole series. Acme Orders is a small order
      service: a couple of routes, an order store, some tests, and one old doc
      somebody may or may not have kept up. So, a
      normal repo.
    show:
      kind: card
      kicker: The demo repo
      heading: Start from the code you already have
      body: Acme Orders, a small order API with tests and one old doc.
  - id: init
    say: >-
      First, initialize. Tiller calls a repo with existing code brownfield, and
      that one word changes what happens next. A new project starts from a
      design. This one starts from code that already works, so before anybody
      plans a change, Tiller wants an honest account of what's there. It's
      like buying an old house; you get the inspection before you start
      knocking out walls. The output lays out the rest of the setup, in order.
    show:
      kind: term
      stage: s1
      from: s1-init
      to: s1-init
  - id: contributor-join
    say: >-
      Next I register myself as a contributor. A human does that, once per
      project, because it records who makes the decisions. Then I join, which
      records who I am in this checkout and wires up my agent. I'm using
      Claude Code, so it gets Tiller's skills and a pointer in its
      instructions. Any other agent reaches the same skills through Tiller's
      guide.
    show:
      kind: term
      stage: s1
      from: s1-add-contributor
      to: s1-join
  - id: first-commit
    say: >-
      One small edit first: I point the tests gate at the script this repo
      already uses, so Tiller runs the same tests I do. Then I commit.
      Everything Tiller knows lives in the repo, in plain files, reviewed like
      any other change.
    show:
      kind: term
      stage: s1
      from: s1-say-gate
      to: s1-commit
  - id: baseline-card
    chapter: The baseline
    say: >-
      Now the job I'd normally put off for a month: writing down what the code
      does today. Not what it should do. Not what the original plan said. What
      it actually does.
    show:
      kind: card
      kicker: The baseline
      heading: Let the agent read the code
      body: As-is docs describe what the code does today.
  - id: ask-guide
    say: >-
      I give the agent one instruction, the same one for the whole series:
      read the guide and do what it says. The guide looks at
      the project and ranks the next moves. Right now there's exactly one.
      Existing code needs a baseline a human has confirmed, and nothing else
      happens until it has one. So the agent loads the skill for deriving it.
    show:
      kind: term
      stage: s1
      from: s1-say-ask
      to: s1-guide
  - id: readiness
    say: >-
      It reads the README, the old doc, and the source. Then it asks Tiller
      whether the project is ready, and gets a no. The right answer.
      There's no design yet, and nobody has confirmed a baseline. That failure
      is the to-do list.
    show:
      kind: term
      stage: s1
      from: s1-say-read
      to: s1-readiness-expect-fail
  - id: move-or-point
    say: >-
      Then it asks a good question. There's already a doc describing the API:
      should Tiller take it over, or leave it and point to it? If other things
      link to that file, you'd keep it. Nothing does here, so I say move it.
    show:
      kind: term
      stage: s1
      from: s1-say-choice
      to: s1-say-move
  - id: link-docs
    say: >-
      The agent splits that doc in two, one for the API and one for the order
      store. Each new doc is linked to the source file it describes and
      to the old doc it came from, so you can always trace where a sentence
      started. Then the old doc goes. Git still has it, and Tiller records
      exactly which version to recover.
    show:
      kind: term
      stage: s1
      from: s1-link-api
      to: s1-baseline-commit
  - id: readout
    say: >-
      Then it stops and hands me a readout; every skill ends this way. Its
      note says nothing in the code disagreed with the old doc. It made two
      docs, both unconfirmed, and says where they came from and how to get
      the original back. At the bottom, what's next. Both items start with
      the word you. The agent is done. The rest is mine.
    show:
      kind: term
      stage: s1
      from: s1-say-notes
      to: s1-readout
  - id: confirm-card
    chapter: Confirm it
    say: >-
      This is the first real decision in the series, and it's small on
      purpose. Is this an accurate picture of the code? Only a person gets to
      say yes.
    show:
      kind: card
      kicker: Your call
      heading: Read it, then confirm it
      body: The agent stops. You decide.
  - id: doc-review
    say: >-
      So I read them. In the console, the API doc is still marked
      unconfirmed, with the file it describes and where it came from. Then
      the part I care about, the behavior to preserve: every route, every
      status code, even a detail the old doc missed about sending a method
      the API doesn't take. If anything here is wrong, fix it now; every
      later change gets measured against this.
    show:
      kind: console
      capture: doc-review
  - id: approve-design
    say: >-
      Both docs match the code, so I confirm them. Confirming doesn't change a
      word of the prose. It records that I read these docs at this commit,
      along with a fingerprint of each source file they describe. That
      fingerprint earns its keep later: when the code changes under a
      confirmed doc, Tiller notices. At the bottom: caught up, no work planned
      yet, and three ways work can come in. That's the next video.
    show:
      kind: term
      stage: s1
      from: s1-say-review
      to: s1-approve-design
  - id: confirm-commit
    say: >-
      I commit the confirmation, since it's just files, and check the status.
      Zero epics, zero features, zero tasks. A clean start, on top of code
      Tiller now understands.
    show:
      kind: term
      stage: s1
      from: s1-confirm-add
      to: s1-status
  - id: see-card
    chapter: See it
    say: >-
      Tiller also ships a console. It runs on your machine and reads the same
      files you just committed, nothing more.
    show:
      kind: card
      kicker: The console
      heading: The same repo, in a browser
      body: Served locally, read straight from the files in git.
  - id: home
    say: >-
      Home is where I start every day. What just happened: the docs I linked
      and confirmed. What needs me: nothing. What's up next: no work planned,
      and how to bring some in. Same answer the terminal gave, in a nicer
      font.
    show:
      kind: console
      capture: home
  - id: doc-confirmed
    say: >-
      The doc itself now carries the sign-off: who confirmed it, at which
      commit, and when. Tiller knows what I already have, and I've agreed with
      it.
    show:
      kind: console
      capture: doc-confirmed
  - id: outro
    say: >-
      Next time we give it something to build. I write one page about a
      feature, and the agent turns it into a plan I can approve.
    show:
      kind: outro
