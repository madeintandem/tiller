id: v1
title: What Tiller is, and how to set it up on a repo you already have
description: >-
  Tiller helps a team of people and coding agents ship software they'd put
  their name on. This video covers what it is and what you install, then sets
  it up on an existing codebase: the agent writes down what the code does
  today, and you read those docs and confirm them. That confirmed baseline is
  what every later change gets measured against. First of three videos that
  take one small feature from an empty plan to merged.


  Install and docs: https://madeintandem.github.io/tiller/

  Source: https://github.com/madeintandem/tiller
tags: [tiller, ai coding agents, claude code, brownfield, spec-driven development]
captures:
  - id: doc-review
    mark: s1-readout
    path: /file/.tiller/design/as-is/orders-api.md#L1
    seconds: 26
    actions:
      # The behavior to preserve (with the 405 detail) is below the fold; bring it up as it is narrated.
      - waitFor: "text=Behavior to preserve"
      - wait: 8
      - scrollTo: "text=Behavior to preserve"
  - id: home
    mark: s1-end
    path: /
    seconds: 22
  - id: doc-confirmed
    mark: s1-end
    path: /file/.tiller/design/as-is/orders-api.md#L1
    seconds: 12
beats:
  - id: hello
    say: >-
      Hi, I'm JC Grubbs, Founder and CEO at Made In Tandem. In this video
      I'm going to introduce Tiller, an open source tool that helps human teams
      and agents write better software, faster, and with more confidence.
    show:
      kind: card
      kicker: Tiller how-to, video 1 of 3
      heading: Set Tiller up on a repo you already have
      art: logo
  - id: why
    chapter: What Tiller is
    say: >-
      If your team builds with coding agents, you've probably noticed that
      writing code isn't the slow part anymore. The slow part is
      everything around it. What should the agent build next? Who has which
      piece, when several people and several agents share a repo? And when an
      agent tells you it's done, are you sure?
    show:
      kind: card
      kicker: Why it exists
      heading: Writing the code isn't the slow part anymore
      art: around
      points:
        - text: What gets built next?
          on: What should the agent
        - text: Who has which piece?
          on: Who has which piece
        - text: Is it really done?
          on: And when an agent
  - id: what
    say: >-
      Tiller is our answer to those questions. It's an open source tool that
      helps a team of people and coding agents ship good software quickly,
      and trust what they've shipped. It keeps the plan in your repo, as plain
      files that people and agents both read. Every piece of work gets a
      definition of done before anyone starts, and your own tests have to
      pass before Tiller will believe it. And the decisions that matter stop
      and wait for a person.
    show:
      kind: card
      kicker: What Tiller is
      heading: Your agent does the work. A person makes the calls.
      body: An open source tool for teams that build with coding agents.
      art: repo
      points:
        - text: The plan lives in your repo, in plain files
          on: It keeps the plan
        - text: Done is defined before the work starts
          on: Every piece of work
        - text: The decisions wait for a person
          on: And the decisions
  - id: parts
    say: >-
      What you install is a small binary with three parts.
      There's a command line tool, which you and your agent both use. There
      are skills, which teach your agent how to do each kind of work. And
      there's a console, a web page served from your own machine, that shows
      where everything stands. No account, no hosted service, and it works
      with whichever coding agent you already use.
    show:
      kind: card
      kicker: What you install
      heading: One binary, three parts
      art: parts
      points:
        - text: A command line tool
          on: a command line tool
        - text: Skills that teach your agent the work
          on: are skills
        - text: A console on your own machine
          on: And there's a console
  - id: breadth
    say: >-
      Here's all of it on one screen, every command and every skill. Please
      don't try to read it all. Most of it is there for when a real project
      needs it. The highlighted items are the ones we'll cover in this video.
    show:
      kind: card
      kicker: The whole tool
      heading: All of Tiller on one screen
      art: cli
  - id: series
    say: >-
      Here's the path we'll walk over three videos, taking one small feature from an idea to merged.
      In this first one, I set Tiller up, the agent writes down what the code
      does today, and I confirm it. In the second, I write one page about the
      feature, the agent turns it into a plan, and I approve it. In the third,
      the agent builds it and reviews it, and I merge. Every row ends on a
      decision that's mine.
    show:
      kind: card
      kicker: This series
      heading: One small feature, from an idea to merged
      art: process
      points:
        - text: Set up
          on: In this first one
        - text: Plan a feature
          on: In the second
        - text: Build it
          on: In the third
  - id: install
    chapter: Install
    say: >-
      So, let's install it. The easiest way to get it is from Homebrew.
      If you're on Linux, there's a short install script linked from
      the README. Either way you end up with that single binary, and no
      settings file hiding in your home directory.
    show:
      kind: card
      kicker: Install
      heading: Get Tiller on your machine
      body: brew install --cask madeintandem/tap/tiller
  - id: version
    say: >-
      Ask for its version to make sure it's on your path. This series was
      recorded on version 0.23.0.
    show:
      kind: term
      stage: s1
      from: s1-version
      to: s1-version
  - id: repo-card
    chapter: Join your repo
    say: >-
      Here's the backstory for the feature we're going to build. Acme Orders is a small order
      service: a couple of routes, an order store, some tests, and one old spec doc
      somebody may or may not have kept up. So, a pretty typical brownfield repo.
    show:
      kind: card
      kicker: The demo repo
      heading: Start from the code you already have
      body: Acme Orders, a small order API with tests and one old doc.
  - id: init
    say: >-
      First, initialize. Since there's already code in this repo we'll use the brownfield flag.
      A new project starts from a design and we'll cover greenfield in another video.
      But for this project, before anybody
      plans a change, Tiller wants an honest account of what's already there. It's
      like buying an old house; you get the inspection before you start
      knocking out walls.
    show:
      kind: term
      stage: s1
      from: s1-init
      to: s1-init
  - id: contributor-join
    say: >-
      Next I register myself as a contributor. This only has to be done once
      per project for each team member. Then I join, which
      records who I am in this particular checkout and it wires up my agent. I'm using
      Claude Code, so it gets Tiller's skills and a pointer in its
      instructions.
    show:
      kind: term
      stage: s1
      from: s1-add-contributor
      to: s1-join
  - id: first-commit
    say: >-
      One small edit first. Tiller won't call work done until all the
      checks and tests pass. In Tiller's config file,
      I uncomment the tests line and point it at the script this repo already
      uses. Then I commit.
      Everything Tiller knows lives in the repo, in plain files, reviewed like
      any other change.
    show:
      kind: term
      stage: s1
      from: s1-say-gate
      to: s1-commit
  - id: baseline-card
    chapter: The baseline
    say: >-
      Now for the job I'd normally put off for a month: writing down what the code
      does today. Not what it should do or what the original plan said. What
      it actually does.
    show:
      kind: card
      kicker: The baseline
      heading: Let the agent read the code
      body: As-is docs describe what the code does today.
  - id: ask-guide
    say: >-
      I open my coding agent in the repo and give it one instruction, the
      same one for the whole series:
      read the guide and do what it says. The guide looks at
      the project and ranks the next moves. Right now there's exactly one.
      Existing code needs a baseline a human has confirmed, and nothing else
      happens until it has one. So the agent loads the skill for deriving it.
    show:
      kind: term
      stage: s1
      from: s1-say-ask
      to: s1-guide
  - id: readiness
    say: >-
      It reads the README, the old doc, and the source. Then it asks Tiller
      whether the project is ready, and gets a no. The right answer.
      There's no design because this is a brownfield project, and nobody has confirmed a baseline of the current code. That failure
      is the to-do list.
    show:
      kind: term
      stage: s1
      from: s1-say-read
      to: s1-readiness-expect-fail
  - id: move-or-point
    say: >-
      Then it asks a good question. There's already a doc describing the API:
      should Tiller take it over, or leave it and point to it? If other things
      link to that file, you'd keep it. Nothing does here, so I say move it.
    show:
      kind: term
      stage: s1
      from: s1-say-choice
      to: s1-say-move
  - id: write-docs
    say: >-
      The agent determins it's best to split that doc in two, one for the API and one for the order
      store, and rewrites each against what the code really does.
    show:
      kind: term
      stage: s1
      from: s1-write-api
      to: s1-write-store
  - id: link-docs
    say: >-
      Each new doc gets linked to the source file it describes and to the old
      doc it came from, so you can always trace where a sentence started.
      Then the old doc goes; git still has it. The README gets pointed at the
      new docs, and the agent commits.
    show:
      kind: term
      stage: s1
      from: s1-link-api
      to: s1-baseline-commit
  - id: readout
    say: >-
      Then it stops and hands me a readout; every skill ends this way. Its
      note says nothing in the code disagreed with the old doc. It made two
      docs, both unconfirmed, and says where they came from and how to get
      the original back. At the bottom, what's next. Both items start with
      the word you. The agent is done. The rest is mine.
    show:
      kind: term
      stage: s1
      from: s1-say-notes
      to: s1-readout
  - id: confirm-card
    chapter: Confirm it
    say: >-
      This is the first real decision in the series, and it's small on
      purpose. Is this an accurate picture of the code? Only a person gets to
      say yes.
    show:
      kind: card
      kicker: Your call
      heading: Read it, then confirm it
      body: The agent stops. You decide.
  - id: open-console
    say: >-
      So I read them. Tiller ships a console for that. One command starts it
      on my own machine and opens it in the browser, and all it does is read
      the files in the repo.
    show:
      kind: term
      stage: s1
      from: s1-serve
      to: s1-serve
  - id: doc-review
    say: >-
      The API doc is still marked unconfirmed, with the file it describes and
      where it came from. Then the part I care about, the behavior to
      preserve: every route, every status code, even a detail the old doc
      missed about sending a method the API doesn't take. If anything here is
      wrong, fix it now; every later change gets measured against this.
    show:
      kind: console
      capture: doc-review
  - id: approve-design
    say: >-
      Both docs match the code, so I confirm them. Confirming doesn't change a
      word of the prose. It records that I read these docs at this commit,
      along with a fingerprint of each source file they describe, so when the
      code changes under a confirmed doc, Tiller notices. At the bottom: caught up, no work planned
      yet, and three ways work can come in. That's the next video.
    show:
      kind: term
      stage: s1
      from: s1-say-review
      to: s1-approve-design
  - id: confirm-commit
    say: >-
      I commit the confirmation, since it's just files, and check the status.
      Zero epics, zero features, zero tasks, which is how Tiller sizes work
      from big to small. A clean start, on top of code Tiller now
      understands.
    show:
      kind: term
      stage: s1
      from: s1-confirm-add
      to: s1-status
  - id: see-card
    chapter: See it
    say: >-
      Back to the console for the bigger picture. It's reading the same
      files I just committed, nothing more.
    show:
      kind: card
      kicker: The console
      heading: The same repo, in a browser
      body: Served locally, read straight from the files in git.
  - id: home
    say: >-
      Home is where I start every day. What just happened: the docs I linked
      and confirmed. What needs me: nothing. What's up next: no work planned,
      and how to bring some in. Same answer the terminal gave, in a nicer
      font.
    show:
      kind: console
      capture: home
  - id: doc-confirmed
    say: >-
      The doc itself now carries the sign-off: who confirmed it, at which
      commit, and when. Tiller knows what I already have, and I've agreed with
      it.
    show:
      kind: console
      capture: doc-confirmed
  - id: outro
    say: >-
      That's Tiller set up on a real repo. To try it on yours, the install
      line and the docs are linked in the description. Next time we give it
      something to build. I write one page about a feature, and the agent
      turns it into a plan I can approve.
    show:
      kind: outro
