name: Docs

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
      - "scripts/third-party-notices*"
      - "third_party/**"
      - "ui/public/fonts/**"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
      - "scripts/third-party-notices*"
      - "third_party/**"
      - "ui/public/fonts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: node --test scripts/fetch-pagefind-source.test.mjs
      # prebuild downloads the Pagefind corresponding-source release asset.
      - run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Website notices match the build
        run: |
          paths="public/THIRD_PARTY_NOTICES.txt src/fonts public/fonts"
          if [ -n "$(git status --porcelain -- $paths)" ]; then
            echo "::error::Website notices are stale. Run 'npm run build' in site/ and commit the regenerated files."
            git status --porcelain -- $paths
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
